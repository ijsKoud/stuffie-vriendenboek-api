stuffie:
  spring:
    security:
      unauthenticated-routes:
        - /v1/scheduled/**
      authorization:
        issuer: https://idp.test/application/o/stuffie/
        audience: stuffie-client
        jwks:
          uri: http://unused.invalid/jwks
          refresh-interval: 0 0 0 * * *
  privacy:
    sub-hash-salt: test-salt
    internal-api-key: test-key
    scheduled-api-key: test-scheduled-key
    platforms:
      stuffies: http://unused.invalid
      photos: http://unused.invalid
spring:
  datasource:
    url: jdbc:h2:mem:privacy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
