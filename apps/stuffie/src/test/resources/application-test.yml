stuffie:
  spring:
    security:
      authorization:
        issuer: https://idp.test/application/o/stuffie/
        audience: stuffie-client
        jwks:
          uri: http://unused.invalid/jwks
  privacy:
    sub-hash-salt: test-salt
  storage:
    driver: local
    local-dir: build/test-photos
spring:
  datasource:
    url: jdbc:h2:mem:stuffie;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
